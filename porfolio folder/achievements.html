<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Achievements</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #f5f5f5;
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        main {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 60px;
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 40px;
            flex-wrap: wrap;
        }

        /* Profile section */
        main section:first-of-type {
            text-align: center;
            flex-shrink: 0;
        }

        main section:first-of-type img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1f1f1f;
            box-shadow: 0 0 40px rgba(126, 211, 33, 0.3);
        }

        main section:first-of-type h2 {
            margin-top: 14px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Achievements list section */
        main section:last-of-type {
            flex: 1;
            min-width: 300px;
        }

        main section h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        main section ul {
            list-style: none;
            padding: 0;
            margin-top: 16px;
            text-align: left;
        }

        main section ul li {
            position: relative;
            padding: 12px 12px 12px 35px;
            margin-bottom: 10px;
            background-color: #161616;
            border-left: 4px solid #7ed321;
            border-radius: 4px;
            color: #cfcfcf;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        main section ul li::before {
            content: "✔";
            position: absolute;
            left: 12px;
            color: #7ed321;
            font-weight: bold;
        }

        main section ul li:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 10px rgba(126, 211, 33, 0.2);
        }

        /* Responsive */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <main>
        <section>
            <img src="eb4e2d1f22d4b27de0f0bb67d771d22decaa1e448dabe67e72c3c32f8f74e8e8.png" alt="Akshat Agarwal"
                width="200" height="200">
            <h2>Akshat Agarwal</h2>
        </section>
        <section>
            <h1>My Achievements</h1>
            <ul>
                <li>Completed a basic foundation course in Python, available on LinkedIn.</li>
                <li>Built a basic foundation in Java and C.</li>
                <li>Completed an HTML course and am now moving toward CSS and JavaScript.</li>
                <li>Contributed to an open-source project on GitHub.</li>
            </ul>
        </section>
    </main>
</body>

</html>
