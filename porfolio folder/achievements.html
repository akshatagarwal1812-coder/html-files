<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Achievements</title>
    <style>
        main section ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
            text-align: left;
        }

        main section ul li {
            position: relative;
            padding: 12px 12px 12px 35px;
            margin-bottom: 10px;
            background-color: #f4f8fb;
            border-left: 4px solid #4a90e2;
            border-radius: 4px;
            color: #444;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        main section ul li::before {
            content: "✔";
            position: absolute;
            left: 12px;
            color: #4a90e2;
            font-weight: bold;
        }

        main section ul li:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        main section h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        main section h2 {
            color: #4a90e2;
            font-weight: 500;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <img src="eb4e2d1f22d4b27de0f0bb67d771d22decaa1e448dabe67e72c3c32f8f74e8e8.png" alt="Akshat Agarwal"
                width="200" height="200">
            <h2>Akshat Agarwal</h2>
        </section>
        <section>
            <h1>My Achievements</h1>
            <ul>
                <li>Completed a basic foundation course in Python, available on LinkedIn.</li>
                <li>Built a basic foundation in Java and C.</li>
                <li>Completed an HTML course and am now moving toward CSS and JavaScript.</li>
                <li>Contributed to an open-source project on GitHub.</li>
            </ul>
        </section>
    </main>
</body>

</html>
